# resource.toml — 打包资源配置（独立于 leno.toml，没有 leno.toml 也能用 ✓）
#
# [pack] 控制 -p 打包：
#   onefile   = true  → 单文件模式：库与资源内嵌进 exe，首次运行解包到**用户缓存目录**
#                       （按资源内容哈希分子目录；不会污染 exe 所在目录/桌面 ✓）
#                       （不加此项时也可用命令行 --onefile 临时开启）
#   resources = 通配模式数组（相对本文件所在目录，声明什么就嵌什么）：
#                 段内 * = 任意长、? = 单字符；单独一段写两个星号 = 跨任意层目录
#                 "image/**" ⇒ image 目录递归全部 ✓
#
# 本游戏的资源（来自 pypvz 的 resources/，逐帧 PNG + ogg + ttf ✓）：
#   image/  （Plants|Zombies|Bullets|Cards|Screen|Items 全部逐帧图 ✓）
#   sound/  （44 个 ogg 音效 ✓）
#   music/  （9 个 ogg 背景音乐 ✓ —— 原版是 opus，miniaudio 只支持 vorbis，已转码 ✓）
#   font/   （DroidSansFallback.ttf ✓）
# ⚠ 字体不打进去的话，单文件 exe 里界面会掉到默认字体（中文显示不出来 ✗）

[pack]
onefile   = true
resources = ["image/**", "sound/**", "music/**", "font/**"]
